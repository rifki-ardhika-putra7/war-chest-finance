<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WAR CHEST NEON</title>

    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;600;800&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        /* --- VARIABEL WARNA NEON --- */
        :root {
            --bg: #050505;
            --card-bg: rgba(30, 30, 30, 0.4);
            /* Transparan */
            --glass: blur(12px) saturate(180%);
            --border: rgba(255, 255, 255, 0.1);

            --neon-green: #00ff9d;
            --neon-red: #ff2a6d;
            --neon-blue: #00f3ff;
            --neon-purple: #bc13fe;

            --text-main: #ffffff;
            --text-muted: #888888;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg);
            /* Background Grid Halus */
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding-bottom: 100px;
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* --- LOGIN SCREEN --- */
        #auth-view {
            height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .auth-box {
            background: var(--card-bg);
            backdrop-filter: var(--glass);
            border: 1px solid var(--border);
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.1);
        }

        .logo-glitch {
            font-family: 'JetBrains Mono';
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--text-main);
            text-shadow: 2px 2px 0px var(--neon-blue);
            margin-bottom: 10px;
            letter-spacing: -2px;
        }

        /* --- INPUT STYLES --- */
        input,
        select {
            width: 100%;
            padding: 16px;
            margin-bottom: 12px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
            color: white;
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        input:focus,
        select:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }

        /* --- BUTTON STYLES --- */
        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            letter-spacing: 1px;
        }

        .btn-neon {
            background: var(--neon-green);
            color: #000;
            box-shadow: 0 0 20px rgba(0, 255, 157, 0.3);
        }

        .btn-neon:active {
            transform: scale(0.98);
        }

        /* --- DASHBOARD HEADER --- */
        #app-view {
            display: none;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .user-badge {
            font-family: 'JetBrains Mono';
            font-size: 0.9rem;
            color: var(--neon-blue);
            border: 1px solid var(--neon-blue);
            padding: 5px 12px;
            border-radius: 50px;
            background: rgba(0, 243, 255, 0.1);
        }

        .logout-btn {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 8px 15px;
            font-size: 0.8rem;
        }

        /* --- MAIN CARD (SALDO) --- */
        .card-main {
            background: linear-gradient(160deg, rgba(30, 30, 30, 0.8), rgba(10, 10, 10, 0.9));
            backdrop-filter: var(--glass);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 25px;
            text-align: center;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Efek Kilat */
        .card-main::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.05), transparent);
            transform: skewX(-25deg);
            animation: shine 6s infinite;
        }

        @keyframes shine {
            0% {
                left: -100%;
            }

            20% {
                left: 200%;
            }

            100% {
                left: 200%;
            }
        }

        .balance-title {
            font-size: 0.7rem;
            color: var(--text-muted);
            letter-spacing: 3px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .balance-val {
            font-family: 'JetBrains Mono';
            font-size: 2.8rem;
            font-weight: 800;
            color: white;
            margin: 5px 0;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 16px;
        }

        .stat-val {
            font-family: 'JetBrains Mono';
            font-weight: 700;
            font-size: 1.1rem;
        }

        .inc {
            color: var(--neon-green);
            text-shadow: 0 0 10px rgba(0, 255, 157, 0.3);
        }

        .exp {
            color: var(--neon-red);
            text-shadow: 0 0 10px rgba(255, 42, 109, 0.3);
        }

        /* --- SURVIVAL & CHART --- */
        .survival-card {
            background: rgba(255, 42, 109, 0.05);
            border: 1px solid rgba(255, 42, 109, 0.3);
            padding: 15px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 20px;
        }

        .surv-val {
            font-family: 'JetBrains Mono';
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--neon-red);
        }

        .chart-container {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 16px;
            border: 1px solid var(--border);
            height: 250px;
            margin-bottom: 25px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .empty-msg {
            position: absolute;
            color: var(--text-muted);
            font-size: 0.8rem;
            text-align: center;
        }

        /* --- INPUT FORM (RESPONSIVE) --- */
        .input-wrapper {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 30px;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        .btn-in {
            background: rgba(0, 255, 157, 0.1);
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
        }

        .btn-out {
            background: rgba(255, 42, 109, 0.1);
            color: var(--neon-red);
            border: 1px solid var(--neon-red);
        }

        /* --- HISTORY LIST --- */
        .list-header {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 700;
            margin-bottom: 15px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .item {
            background: rgba(255, 255, 255, 0.03);
            padding: 15px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border-left: 4px solid transparent;
            transition: 0.2s;
        }

        .item.IN {
            border-left-color: var(--neon-green);
        }

        .item.OUT {
            border-left-color: var(--neon-red);
        }

        .item:active {
            transform: scale(0.98);
            background: rgba(255, 255, 255, 0.05);
        }

        .cat-tag {
            font-size: 0.65rem;
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 8px;
            border-radius: 6px;
            margin-right: 8px;
            color: #ccc;
        }

        .del-btn {
            background: none;
            border: none;
            color: #444;
            font-size: 1.2rem;
            padding-left: 15px;
            cursor: pointer;
        }

        .del-btn:hover {
            color: var(--neon-red);
        }

        /* --- 📱 MOBILE RESPONSIVE BREAKPOINT --- */
        @media (max-width: 480px) {
            body {
                padding: 15px;
            }

            .balance-val {
                font-size: 2.2rem;
            }

            /* STACKING INPUTS (PENTING BUAT HP) */
            .input-row {
                flex-direction: column;
                gap: 0;
            }

            input,
            select {
                padding: 14px;
                font-size: 16px;
            }

            /* Anti-zoom iPhone */

            .auth-box {
                padding: 25px;
            }

            .logo-glitch {
                font-size: 2rem;
            }
        }
    </style>
</head>

<body>

    <div id="auth-view">
        <div class="container">
            <div class="auth-box">
                <div class="logo-glitch">WAR CHEST</div>
                <div style="color:#888; margin-bottom:30px; letter-spacing:2px; font-size:0.8rem;">FINANCIAL SURVIVAL
                    TOOL</div>

                <input type="text" id="uName" placeholder="Username (Codename)">
                <input type="password" id="uPass" placeholder="Password (Key)">

                <button class="btn-neon" onclick="auth()">ACCESS SYSTEM</button>

                <div class="auth-link" onclick="toggleAuth()"
                    style="margin-top:20px; color:#666; font-size:0.8rem; cursor:pointer; text-decoration: underline;">
                    Create New Account
                </div>
            </div>
        </div>
    </div>

    <div id="app-view">
        <div class="container">
            <div class="top-bar">
                <div class="user-badge" id="dispUser">USER</div>
                <button class="logout-btn" onclick="logout()">LOGOUT</button>
            </div>

            <div class="card-main">
                <div class="balance-title">SALDO PERANG</div>
                <div class="balance-val" id="bal">Rp 0</div>
                <div class="stats-row">
                    <div class="stat-box">
                        <div style="font-size:0.7rem; color:#666">MASUK</div>
                        <div class="stat-val inc" id="inc">0</div>
                    </div>
                    <div class="stat-box" style="text-align:right">
                        <div style="font-size:0.7rem; color:#666">KELUAR</div>
                        <div class="stat-val exp" id="exp">0</div>
                    </div>
                </div>
            </div>

            <div class="survival-card">
                <div class="surv-label" style="margin-bottom:5px;">SURVIVAL ESTIMATION</div>
                <div class="surv-val" id="surv">CALCULATING...</div>
            </div>

            <div class="chart-container">
                <div id="emptyChart" class="empty-msg" style="display:none;">DATA KOSONG<br>Input pengeluaran dulu</div>
                <canvas id="chart"></canvas>
            </div>

            <div class="input-wrapper">
                <input type="text" id="desc" placeholder="Keterangan (Cth: Ayam Bakar)">
                <div class="input-row">
                    <input type="number" id="amount" placeholder="Nominal (Rp)">
                    <select id="cat">
                        <option value="Makan">Makan</option>
                        <option value="Gym">Gym/Supps</option>
                        <option value="Project">Project</option>
                        <option value="Transport">Transport</option>
                        <option value="Jajan">Jajan</option>
                        <option value="Lainnya">Lainnya</option>
                    </select>
                </div>
                <div class="btn-group">
                    <button class="btn-in" onclick="add('IN')">MASUK (+)</button>
                    <button class="btn-out" onclick="add('OUT')">KELUAR (-)</button>
                </div>
            </div>

            <div class="list-header">LOG TRANSAKSI</div>
            <div id="list"></div>
        </div>
    </div>

    <script>
        const API = "http://127.0.0.1:5001/api";
        const fmt = (n) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(n);
        let myChart = null;
        let isRegister = false;

        // --- AUTH ---
        function init() {
            const token = localStorage.getItem('wc_token');
            if (token) {
                document.getElementById('auth-view').style.display = 'none';
                document.getElementById('app-view').style.display = 'block';
                document.getElementById('dispUser').innerText = localStorage.getItem('wc_user').toUpperCase();
                loadData();
            } else {
                document.getElementById('auth-view').style.display = 'flex';
                document.getElementById('app-view').style.display = 'none';
            }
        }

        function toggleAuth() {
            isRegister = !isRegister;
            document.querySelector('.btn-neon').innerText = isRegister ? "REGISTER NEW" : "ACCESS SYSTEM";
        }

        async function auth() {
            const u = document.getElementById('uName').value;
            const p = document.getElementById('uPass').value;
            const endpoint = isRegister ? '/register' : '/login';

            try {
                const res = await fetch(`${API}${endpoint}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });
                const data = await res.json();

                if (res.ok) {
                    if (isRegister) { alert("Registered! Login now."); isRegister = false; auth(); }
                    else { localStorage.setItem('wc_token', data.token); localStorage.setItem('wc_user', data.username); init(); }
                } else { alert(data.error); }
            } catch (e) { alert("Server Error"); }
        }

        function logout() { localStorage.clear(); init(); }
        function head() { return { 'Content-Type': 'application/json', 'Authorization': localStorage.getItem('wc_token') }; }

        // --- CORE LOGIC ---
        async function loadData() {
            const [rSum, rList, rStats] = await Promise.all([
                fetch(`${API}/summary`, { headers: head() }),
                fetch(`${API}/transactions`, { headers: head() }),
                fetch(`${API}/stats`, { headers: head() })
            ]);

            const sum = await rSum.json();
            document.getElementById('bal').innerText = fmt(sum.balance);
            document.getElementById('inc').innerText = fmt(sum.income);
            document.getElementById('exp').innerText = fmt(sum.expense);

            // SURVIVAL LOGIC
            const days = sum.survival_days;
            const survEl = document.getElementById('surv');
            const card = document.querySelector('.survival-card');

            if (sum.expense === 0 && sum.income > 0) {
                survEl.innerText = "∞ (HEMAT)";
                survEl.style.color = "#00d2ff";
                card.style.borderColor = "#00d2ff";
            } else if (sum.balance <= 0) {
                survEl.innerText = "KRITIS (BANGKRUT)";
                survEl.style.color = "#ff2a6d";
                card.style.borderColor = "#ff2a6d";
            } else if (days > 30) {
                survEl.innerText = "AMAN (>30 HARI)";
                survEl.style.color = "#00ff9d";
                card.style.borderColor = "#00ff9d";
            } else {
                survEl.innerText = `${days} HARI LAGI`;
                survEl.style.color = days < 7 ? "#ff2a6d" : "#ffea00";
                card.style.borderColor = days < 7 ? "#ff2a6d" : "#ffea00";
            }

            // LIST RENDER
            const list = await rList.json();
            const cont = document.getElementById('list'); cont.innerHTML = "";
            list.forEach(d => {
                const col = d.type === 'IN' ? 'var(--neon-green)' : 'var(--neon-red)';
                const sgn = d.type === 'IN' ? '+' : '-';
                cont.innerHTML += `
                <div class="item ${d.type}">
                    <div><span class="cat-tag">${d.category}</span> ${d.note} <div style="font-size:0.65rem;color:#888;margin-top:3px">${d.date}</div></div>
                    <div style="color:${col};font-weight:800; font-family:'JetBrains Mono'">${sgn} ${fmt(d.amount)} <button class="del-btn" onclick="del(${d.id})">×</button></div>
                </div>`;
            });

            // CHART RENDER
            const stats = await rStats.json();
            const emptyEl = document.getElementById('emptyChart');
            const chartEl = document.getElementById('chart');

            if (stats.data.length === 0) {
                emptyEl.style.display = 'block'; chartEl.style.display = 'none';
                if (myChart) myChart.destroy();
            } else {
                emptyEl.style.display = 'none'; chartEl.style.display = 'block';
                const ctx = chartEl.getContext('2d');
                if (myChart) myChart.destroy();
                myChart = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: stats.labels,
                        datasets: [{ data: stats.data, backgroundColor: ['#ff2a6d', '#00d2ff', '#00ff9d', '#ffea00', '#bc13fe'], borderWidth: 0, hoverOffset: 10 }]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        plugins: { legend: { position: 'right', labels: { color: '#ccc', boxWidth: 10, font: { family: 'Inter' } } } },
                        cutout: '75%'
                    }
                });
            }
        }

        async function add(type) {
            const note = document.getElementById('desc').value;
            const amount = document.getElementById('amount').value;
            const cat = document.getElementById('cat').value; // FIX ID
            if (!amount) return alert("Isi nominal!");

            await fetch(`${API}/add`, {
                method: 'POST', headers: head(),
                body: JSON.stringify({ type, category: cat, amount, note })
            });
            document.getElementById('desc').value = ''; document.getElementById('amount').value = '';
            loadData();
        }

        async function del(id) {
            if (confirm("Hapus data ini?")) { await fetch(`${API}/delete/${id}`, { method: 'DELETE', headers: head() }); loadData(); }
        }

        init();
    </script>
</body>

</html>
